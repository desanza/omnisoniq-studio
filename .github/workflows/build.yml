name: Build Omnisoniq Studio VST3

on:
  push:
    branches: [ main, master ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Manual trigger from GitHub UI

jobs:
  build-windows:
    name: Windows x64 VST3
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-7.0.12-${{ runner.os }}

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target Omnisoniq_VST3 -j 4

      - name: Find VST3 output
        id: vst3path
        run: |
          $path = Get-ChildItem -Path build -Recurse -Filter "*.vst3" | Select-Object -First 1
          echo "VST3_DIR=$($path.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "Found VST3 at: $($path.FullName)"

      - name: Copy python folder next to VST3
        run: |
          $vst3dir = "${{ steps.vst3path.outputs.VST3_DIR }}"
          Copy-Item -Path python -Destination "$vst3dir\Omnisoniq Studio.vst3\python" -Recurse -Force

      - name: Create installer zip
        run: |
          $out = "OmnisoniqStudio_Windows_x64"
          New-Item -ItemType Directory -Path $out -Force

          # Copy VST3
          Copy-Item -Path "build\Omnisoniq_artefacts\Release\VST3\Omnisoniq Studio.vst3" `
                    -Destination "$out\" -Recurse -Force

          # Copy python helper
          Copy-Item -Path python -Destination "$out\python" -Recurse -Force

          # Copy install script
          Copy-Item -Path scripts\install_vst.bat -Destination "$out\" -Force

          # Copy readme
          Copy-Item -Path SETUP.md -Destination "$out\README.txt" -Force

          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip" -Force

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: OmnisoniqStudio-Windows-x64
          path: OmnisoniqStudio_Windows_x64.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OmnisoniqStudio_Windows_x64.zip
          name: Omnisoniq Studio ${{ github.ref_name }}
          body: |
            ## Omnisoniq Studio VST3 — Windows x64

            ### Install
            1. Download `OmnisoniqStudio_Windows_x64.zip`
            2. Extract the zip
            3. Run `install_vst.bat` as Administrator
            4. Open your DAW and scan for VST3 plugins

            ### Stem Separation (AI)
            Requires Python + Demucs. After installing the plugin:
            ```
            pip install demucs
            ```

            ### Requirements
            - Windows 10/11 x64
            - Any VST3-compatible DAW (FL Studio, Ableton, Reaper, Cubase, etc.)
